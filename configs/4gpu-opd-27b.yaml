# General OPD：4B 学生 + 27B 教师（bf16 约 54GB；按 4 张 48GB 卡写，教师用 2 张卡做张量并行）
# 80GB 卡（A100 / H100）可以把教师放在 1 张卡上：gpus 改成 [2]、tensor_parallel_size 改成 1。
# 卡不够时可以换更小的教师（如 Qwen3.5-9B），见 General OPD 章节的双卡示例。
#   GPU 0    : 学生 LoRA 训练
#   GPU 1    : 学生 vLLM 采样
#   GPU 2,3  : 教师 Qwen3.6-27B，tensor_parallel_size=2，只做 compute_logprobs
# 用法：LOCALTRIO_CONFIG=configs/4gpu-opd-27b.yaml uv run python experiments/general-opd/01-demo-sync.py
trainer:
  gpus: [0]
models:
  default:
    gpus: [1]
    gpu_memory_utilization: 0.85
  Qwen/Qwen3.6-27B:
    gpus: [2, 3]
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.90
    max_model_len: 16384
    # 保守取值：27B 权重已占每卡约 27GB，预填充分块小一点，启动时估算的激活峰值更低，
    # 给 KV cache 多留空间（代价是长 prompt 预填充稍慢）。compute_logprobs 的显存尖峰与它
    # 无关：vLLM 0.33 固定按 1024 行分块计算 prompt logprobs
    max_num_batched_tokens: 1024
    enable_lora: false            # 教师只用基模；若教师是带 LoRA 的 checkpoint，改为 true
