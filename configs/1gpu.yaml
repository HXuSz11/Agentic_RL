# 只有 1 张卡时：训练与采样共用 GPU 0（vLLM 只占 40% 显存）
# 需要 48GB 及以上的卡（如 RTX A6000 / RTX 6000 Ada / L40S，或 80GB 的 A100 / H100）：
# 4B 模型可以跑通全部单基模章节，但速度约为 4 卡布局的 1/3～1/4。
# 24GB / 32GB 单卡放不下“训练 + vLLM”两份 4B 权重和 KV cache，建议至少 2 张卡（24GB 卡用 24gb.yaml）。
# 不写配置文件时，检测到只有 1 张卡也会自动这样分配；这个文件把取值写明，方便修改。
trainer:
  gpus: [0]
  max_tokens_per_microbatch: 8192
models:
  default:
    gpus: [0]
    gpu_memory_utilization: 0.40
    max_num_seqs: 128
