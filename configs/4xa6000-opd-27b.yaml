# General OPD：4B 学生 + 27B 教师（bf16 约 54GB，需要 2 张卡做张量并行）
#   GPU 0    : 学生 LoRA 训练
#   GPU 1    : 学生 vLLM 采样
#   GPU 2,3  : 教师 Qwen3.6-27B，tensor_parallel_size=2，只做 compute_logprobs
# 用法：LOCALTRIO_CONFIG=configs/4xa6000-opd-27b.yaml python experiments/general-opd/01-demo-sync.py
trainer:
  gpus: [0]
models:
  default:
    gpus: [1]
    gpu_memory_utilization: 0.85
  Qwen/Qwen3.6-27B:
    gpus: [2, 3]
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.90
    max_model_len: 16384
    # compute_logprobs 要为每个 prompt token 计算整词表 fp32 logprob（在一张卡上汇总），
    # 27B 权重已占每卡约 27GB，这里把单次预填充压到 1024 token 防止显存尖峰
    max_num_batched_tokens: 1024
    enable_lora: false            # 教师只用基模；若教师是带 LoRA 的 checkpoint，改为 true
