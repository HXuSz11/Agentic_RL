  <g font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace">
    <rect x="804" y="150" width="324" height="330" rx="20" fill="#121820" stroke="#2d3742"/>
    <g transform="translate(828 176)">
      <rect width="276" height="60" rx="12" fill="#13251f" stroke="#1f6e59"/>
      <rect x="14" y="16" width="62" height="28" rx="7" fill="#1fb58f" fill-opacity=".16"/>
      <text x="45" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#45d0aa">GPU 0</text>
      <text x="92" y="30" font-family="'PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="17" font-weight="700" fill="#e6ebf0">训练 · LoRA</text>
      <rect x="92" y="40" width="168" height="6" rx="3" fill="#1fb58f"/>
    </g>
    <g transform="translate(828 248)">
