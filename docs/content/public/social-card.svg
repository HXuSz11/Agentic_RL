<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e6ebf0" stroke-opacity=".05"/></pattern>
    <radialGradient id="glowA" cx="0.82" cy="0.28" r="0.5"><stop offset="0" stop-color="#508cff" stop-opacity=".22"/><stop offset="1" stop-color="#508cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.62" cy="0.85" r="0.45"><stop offset="0" stop-color="#1fb58f" stop-opacity=".22"/><stop offset="1" stop-color="#1fb58f" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#45d0aa"/><stop offset="1" stop-color="#74a8ff"/></linearGradient>
    <linearGradient id="wire" x1="0" x2="1"><stop offset="0" stop-color="#1fb58f"/><stop offset="1" stop-color="#74a8ff"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d1116"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- 标志与站名 -->
  <g transform="translate(72 64)">
    <rect width="44" height="44" rx="11" fill="#16202a" stroke="#2d3742"/>
    <rect x="9" y="9" width="11.5" height="11.5" rx="3" fill="#2ec4a0"/>
    <rect x="24" y="9" width="11" height="11" rx="2.6" fill="none" stroke="#6fa8ff" stroke-width="2"/>
    <rect x="9" y="24" width="11" height="11" rx="2.6" fill="none" stroke="#6fa8ff" stroke-width="2"/>
    <rect x="24" y="24" width="11" height="11" rx="2.6" fill="none" stroke="#6fa8ff" stroke-width="2"/>
    <text x="62" y="30" font-family="'PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="24" font-weight="700" fill="#e6ebf0">Agentic RL 本地实战</text>
  </g>

  <!-- 标题 -->
  <text x="72" y="236" font-family="'PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="60" font-weight="700" fill="#e6ebf0">把 16 个 Agentic RL 实验</text>
  <text x="72" y="318" font-family="'PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="60" font-weight="700" fill="#e6ebf0">跑在<tspan fill="url(#ink)">自己的显卡</tspan>上</text>
  <text x="74" y="384" font-family="'PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="25" fill="#a8b3be">localtrio：transformers + PEFT 训练 LoRA，vLLM 采样</text>
  <text x="74" y="424" font-family="'PingFang SC','Noto Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="25" fill="#a8b3be">接口与 PyTRIO 同名同参 · GRPO / DAPO / OPD / Agent</text>

